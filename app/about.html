<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechPulse</title>
<meta name="description" content="TechPulse - daily tech and AI news videos">
<style>
  :root { --bg: #ffffff; --text: #121826; --muted: #5d6880; --link: #1a5fd6; --accent: #e8b800; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1220; --text: #e8edf7; --muted: #8d9ab5; --link: #7cb7ff; --accent: #ffd400; } }
  :root[data-theme="dark"] { --bg: #0b1220; --text: #e8edf7; --muted: #8d9ab5; --link: #7cb7ff; --accent: #ffd400; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #1a1400; font-weight: 900;
    font-size: 22px; display: grid; place-items: center; }
  h1 { font-size: 30px; margin: 16px 0 8px; } p { color: var(--muted); } a { color: var(--link); }
</style>
</head>
<body>
<main>
  <div class="logo">TP</div>
  <h1>TechPulse</h1>
  <p>Daily tech and AI news, explained in minutes. Watch on YouTube:
    <a href="https://www.youtube.com/@techpulse-op">youtube.com/@techpulse-op</a></p>
  <p>TechPulse Uploader is the channel owner's private tool for publishing these videos.
    <a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>

name: Publish + app requests

on:
  schedule:
    - cron: "3-59/10 * * * *"   # backup only; the Clock workflow triggers this every 10 minutes
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keepalive: GitHub disables schedules in repos with no activity for 60 days

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # comment replies are written by the AI
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      GITHUB_TOKEN: ${{ github.token }}  # short-lived; lets 'Run now' in the app start a factory run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests google-api-python-client google-auth-oauthlib edge-tts imageio-ffmpeg
      - run: python -u autotube.py --publish-pending --process-requests --quick-stats --reply-comments
      - uses: liskin/gh-workflow-keepalive@v1

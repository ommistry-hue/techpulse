name: Publish + app requests

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keepalive: GitHub disables schedules in repos with no activity for 60 days

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_TOKEN_JSON_HI: ${{ secrets.YT_TOKEN_JSON_HI }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      GITHUB_TOKEN: ${{ github.token }}  # short-lived; lets 'Run now' in the app start a factory run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests google-api-python-client google-auth-oauthlib edge-tts imageio-ffmpeg
      - run: python -u autotube.py --publish-pending --process-requests
      - uses: liskin/gh-workflow-keepalive@v1

name: Factory (make + upload videos)

# YouTube API quota is 10,000 units/day per Google project; one upload costs 1,600.
# Two projects: English uploads use project 1, Hindi uploads project 2 -> 4 scheduled uploads each per day,
# leaving 2 per project for breaking news (the cap is checked before every breaking upload).
# Started by the Clock workflow (tools/clock.py) on a fixed UTC plan, because GitHub drops many cron runs:
#   EN 12:17 (1 long + 1 Short), 16:43, 21:23 (1 Short each) | HI 01:33, 07:47 (1 Short each), 13:37 (1 long + 1 Short)
#   Breaking-news check every 3 hours at :29 (a Short only when something big just broke)
run-name: Factory ${{ inputs.slot || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language (en or hi)"
        default: "en"
      long:
        description: "Long videos (0 or 1)"
        default: "1"
      shorts:
        description: "Shorts (0-4)"
        default: "1"
      upload:
        description: "Upload to YouTube (no = test render only, saves the daily upload limit)"
        default: "yes"
      mode:
        description: "normal, breaking (breaking-news check) or viral (one viral-format Short)"
        default: "normal"
      slot:
        description: "Set by the Clock (names the run so a slot never runs twice)"
        default: ""
      followup:
        description: "Set automatically: YouTube id of a breakout Short to make a part 2 for"
        default: ""

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # Sunday weekly special renders ~12 min of video
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_TOKEN_JSON_2: ${{ secrets.YT_TOKEN_JSON_2 }}
      YT_CLIENT_SECRET_JSON_2: ${{ secrets.YT_CLIENT_SECRET_JSON_2 }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
      NICHE: ${{ vars.NICHE }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      TTS_RATE: ${{ vars.TTS_RATE }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      YT_CATEGORY: ${{ vars.YT_CATEGORY }}
      USE_WIKIMEDIA: ${{ vars.USE_WIKIMEDIA }}
      AMAZON_TAG_US: ${{ vars.AMAZON_TAG_US }}
      AMAZON_TAG_IN: ${{ vars.AMAZON_TAG_IN }}
      RHUBARB_VERSION: "1.14.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install animation renderer (Remotion)
        working-directory: motion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
      - name: Cache lip-sync tool (Rhubarb)
        uses: actions/cache@v4
        with:
          path: tools/bin
          key: rhubarb-${{ env.RHUBARB_VERSION }}-linux
      - name: Install lip-sync tool (Rhubarb)
        run: |
          if ! ls tools/bin/Rhubarb-Lip-Sync-*/rhubarb >/dev/null 2>&1; then
            mkdir -p tools/bin
            curl -sSL -o /tmp/rhubarb.zip "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${RHUBARB_VERSION}/Rhubarb-Lip-Sync-${RHUBARB_VERSION}-Linux.zip"
            unzip -q /tmp/rhubarb.zip -d tools/bin
          fi
          chmod +x tools/bin/Rhubarb-Lip-Sync-*/rhubarb
      - name: Cache background music
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-kevin-macleod-v1
      - name: Get background music (Kevin MacLeod, CC BY 4.0; credited in each description)
        run: |
          mkdir -p assets/music
          for n in "Digital Lemonade" "Voxel Revolution" "Inspired" "Hyperfun" "Funk Game Loop"; do
            f="assets/music/${n// /_}.mp3"
            [ -s "$f" ] && continue
            curl -sSLf --retry 3 --max-time 180 -o "$f" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/${n// /%20}.mp3" \
              || { echo "skip $n"; rm -f "$f"; }
          done
          ls -la assets/music
      - name: Decide language and how many videos
        id: plan
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_FOLLOWUP: ${{ inputs.followup }}
          IN_LANG: ${{ inputs.lang }}
          IN_LONG: ${{ inputs.long }}
          IN_SHORTS: ${{ inputs.shorts }}
          IN_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "$IN_MODE" = "breaking" ]; then echo "args=--breaking" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$IN_MODE" = "viral" ]; then
            [[ "${IN_LANG:-en}" =~ ^(en|hi)$ ]] || { echo "bad lang"; exit 1; }
            EXTRA=""; [ "${IN_UPLOAD:-yes}" = "no" ] && EXTRA="--no-upload"
            echo "args=--lang ${IN_LANG:-en} --viral $EXTRA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FU=""; if [ -n "$IN_FOLLOWUP" ]; then [[ "$IN_FOLLOWUP" =~ ^[A-Za-z0-9_-]{6,20}$ ]] || { echo "bad followup"; exit 1; }; FU="--followup $IN_FOLLOWUP"; fi
          G="${IN_LANG:-en}"; L="${IN_LONG:-1}"; S="${IN_SHORTS:-1}"
          [[ "$G" =~ ^(en|hi)$ && "$L" =~ ^[01]$ && "$S" =~ ^[0-4]$ ]] || { echo "bad input"; exit 1; }
          EXTRA=""; [ "${IN_UPLOAD:-yes}" = "no" ] && EXTRA="--no-upload"
          echo "args=--lang $G --long $L --shorts $S $EXTRA $FU" >> "$GITHUB_OUTPUT"
      - name: Make and upload
        env:
          CLOCK_SLOT: ${{ inputs.slot }}  # set for scheduled slots (goal strategy may turn a Short slot into a long video)
        run: python -u autotube.py ${{ steps.plan.outputs.args }} --publish-pending --stats --cleanup --reply-comments

name: Factory (make + upload videos)

on:
  schedule:
    - cron: "17 12 * * *"   # 1 long + 1 Short
    - cron: "43 16 * * *"    # 2 Shorts
    - cron: "23 21 * * *"    # 1 Short
  workflow_dispatch:
    inputs:
      long:
        description: "Long videos (0 or 1)"
        default: "1"
      shorts:
        description: "Shorts (0-4)"
        default: "1"

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
      GEO: ${{ vars.GEO }}
      NICHE: ${{ vars.NICHE }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_RATE: ${{ vars.TTS_RATE }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      YT_CATEGORY: ${{ vars.YT_CATEGORY }}
      USE_WIKIMEDIA: ${{ vars.USE_WIKIMEDIA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install animation renderer (Remotion)
        working-directory: motion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
      - name: Decide how many videos
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IN_LONG: ${{ inputs.long }}
          IN_SHORTS: ${{ inputs.shorts }}
        run: |
          case "$SCHEDULE" in
            "17 12 * * *") L=1; S=1 ;;
            "43 16 * * *")  L=0; S=2 ;;
            "23 21 * * *")  L=0; S=1 ;;
            *) L="${IN_LONG:-1}"; S="${IN_SHORTS:-1}" ;;
          esac
          [[ "$L" =~ ^[01]$ && "$S" =~ ^[0-4]$ ]] || { echo "bad input"; exit 1; }
          echo "args=--long $L --shorts $S" >> "$GITHUB_OUTPUT"
      - name: Make and upload
        run: python -u autotube.py ${{ steps.plan.outputs.args }} --publish-pending --stats --cleanup

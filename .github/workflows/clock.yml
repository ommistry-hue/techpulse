name: Clock (reliable scheduler)

# GitHub drops many `schedule:` runs, so videos are started by tools/clock.py running inside one long job.
# The cron below is only a watchdog: if the clock ever stops, the next watchdog run that fires restarts it
# (a new clock run exits within 3 minutes if another clock is already running).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # start factory / publish runs and the next clock run

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - run: python3 -u tools/clock.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # "Log in to YouTube" button in the phone app: the clock trades Google's one-time code for a lasting login
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OAUTH_WEB_JSON_1: ${{ secrets.OAUTH_WEB_JSON_1 }}
          OAUTH_WEB_JSON_2: ${{ secrets.OAUTH_WEB_JSON_2 }}

name: AI models health check

# Tests every AI model in the fallback chain (Gemini incl. auto-discovered models, OpenRouter free) and saves the result for the
# app. Weekly, or on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
        timeout-minutes: 10
      - run: python -u autotube.py --llm-check
